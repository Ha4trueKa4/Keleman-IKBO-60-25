# Пример конфигурации анализатора зависимостей (вариант 15).
# Все параметры задаются в секции [analyzer].

[analyzer]
# Имя анализируемого пакета.
package = bash
# URL репозитория apt или путь к файлу тестового репозитория.
repo_url = http://archive.ubuntu.com/ubuntu/dists/jammy/main/binary-amd64/Packages.gz
# Режим работы с тестовым репозиторием (true/false).
test_mode = false
# Версия пакета (пусто — любая/последняя).
version =
# Выводить зависимости в виде ASCII-дерева (true/false).
ascii_tree = true
# Максимальная глубина анализа зависимостей.
max_depth = 3
# Подстрока для исключения пакетов из анализа (пусто — без фильтра).
filter =
